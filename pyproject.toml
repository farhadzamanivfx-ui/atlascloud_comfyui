[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlascloud-comfyui-community"
version = "0.1.0"
description = "Unofficial community edition of the Atlas Cloud ComfyUI nodes: 440+ cloud video, image, edit and 3D nodes, synced with upstream, plus parallel execution and 3D generation."
authors = [
  {name = "AtlasCloud", email = "irene.chen@atlascloud.ai"},
  {name = "Farhad Zamani", email = "farhadzamani.vfx@gmail.com"},
]
readme = "README.md"
license = {text = "MIT license"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "requests",
    "numpy",
    "pillow"
]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/farhadzamanivfx-ui/atlascloud_comfyui"
BugTracker = "https://github.com/farhadzamanivfx-ui/atlascloud_comfyui/issues"
Documentation = "https://github.com/farhadzamanivfx-ui/atlascloud_comfyui#readme"
Upstream = "https://github.com/AtlasCloudAI/atlascloud_comfyui"


[tool.comfy]
PublisherId = ""  # TODO: create your publisher at https://registry.comfy.org and put its id here
DisplayName = "AtlasCloud ComfyUI (Community Edition)"
Icon = ""
Tags = ["api", "cloud", "video", "image", "3d", "seedance", "kling", "veo", "nano-banana", "gpt-image"]
Repository = "https://github.com/farhadzamanivfx-ui/atlascloud_comfyui"

includes = ["src/atlascloud_comfyui"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
# Allow untyped imports for third-party libraries
module = "atlascloud_comfyui.client.*"
ignore_missing_imports = true

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
